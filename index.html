<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>K-Drama Football League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a111e;
  --side:#0d1627;
  --panel:#111c30;
  --panel2:#16233b;
  --row:#132038;
  --line:#1f2e4a;
  --line2:#2a3d60;
  --text:#e7edf8;
  --muted:#8697b5;
  --dim:#5d6f8f;
  --accent:#3b7bff;
  --accent-soft:rgba(59,123,255,.16);
  --gold:#f3c24f;
  --silver:#c8d2e2;
  --bronze:#d58d52;
  --good:#39c98a;
  --bad:#ff6b6b;
  --shame:#ff5c7a;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,th{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 14px 30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.wordmark{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:.04em;line-height:1;text-transform:uppercase;padding:4px 8px 20px}
.wordmark small{display:block;font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:6px}
.mgr-pill{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:20px}
.mgr-pill b{font-size:13px}
.mgr-pill span{font-size:11px;color:var(--muted);display:block}
.nav-group{margin-bottom:18px}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.nav a:hover{color:var(--text);background:var(--panel)}
.nav a.on{background:var(--accent);color:#fff}
.nav a svg{width:16px;height:16px;flex:none;opacity:.9}
.side-foot{margin-top:24px;padding:12px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}

.main-wrap{min-width:0}
.main{min-width:0;padding:22px 28px 60px}
.topbar{display:none}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.ph-left{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:8px;background:#fff;color:#0a111e;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;flex:none}
.ph-title{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.ph-sub{color:var(--muted);font-size:12.5px;margin-top:5px;display:flex;align-items:center;gap:6px}
.reigning{display:flex;gap:18px;align-items:flex-end}
.reigning .rc{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.reigning .cap{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:800;text-align:right;margin-top:4px}

/* ---------- common ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:5px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.tab:hover{color:var(--text);border-color:var(--line2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:7px;vertical-align:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.card-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.card-h p{margin:3px 0 0;color:var(--muted);font-size:12px}
.card-b{padding:16px}
.ctrl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:5px;padding:6px 28px 6px 10px;font-size:12.5px;font-weight:600;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
tbody tr:hover td{background:var(--row)}
tr.me td{background:var(--accent-soft)!important}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.c{text-align:center}
.mut{color:var(--muted)}
.dim{color:var(--dim)}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.who{display:flex;align-items:center;gap:9px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#0a111e;flex:none;letter-spacing:.02em}
.who b{font-weight:700}
.who .tn{display:block;font-size:11px;color:var(--muted);font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tro{display:inline-flex;align-items:center;gap:2px;margin-right:6px;font-size:11px;font-weight:700;color:var(--muted)}
.tro svg{width:15px;height:15px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.chip.gold{color:var(--gold);border-color:rgba(243,194,79,.45);background:rgba(243,194,79,.08)}
.chip.shame{color:var(--shame);border-color:rgba(255,92,122,.45);background:rgba(255,92,122,.08)}
.chip.blue{color:#9dbcff;border-color:rgba(59,123,255,.5);background:var(--accent-soft)}
.note{color:var(--dim);font-size:11.5px;padding:10px 16px;border-top:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* ---------- home ---------- */
.hero{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:linear-gradient(115deg,#13254a 0%,#0f1b33 55%,#0c1526 100%);padding:26px 26px 24px;margin-bottom:22px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:320px;height:320px;background:radial-gradient(closest-side,rgba(243,194,79,.18),transparent);pointer-events:none}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,64px);line-height:.95;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero .by{font-size:15px;font-weight:600;color:var(--silver)}
.hero .by b{color:var(--text)}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.hs b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.hs span{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.champline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line)}
.cl{background:var(--panel);padding:14px 14px 13px;min-width:0}
.cl .yr{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.cl .nm{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;margin-top:6px;display:flex;align-items:center;gap:6px}
.cl .nm svg{width:18px;height:18px}
.cl .tm{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .sc{font-size:11px;color:var(--dim);margin-top:6px}

/* ---------- bracket ---------- */
.bracket{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:22px;min-width:640px}
.round h4{margin:0 0 10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.round h4 span{color:var(--dim);margin-left:6px}
.round .stack{display:flex;flex-direction:column;justify-content:space-around;gap:14px;height:calc(100% - 26px)}
.mu{border:1px solid var(--line2);border-radius:6px;background:var(--panel2);overflow:hidden}
.mu.final{border-color:rgba(243,194,79,.5)}
.mr{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;border-bottom:1px solid var(--line)}
.mr:last-child{border-bottom:0}
.mr .sd{width:14px;color:var(--dim);font-size:11px;font-weight:700}
.mr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.mr .nm small{color:var(--dim);margin-left:4px}
.mr .pt{font-weight:700;color:var(--muted)}
.mr.w .nm,.mr.w .pt{color:var(--text);font-weight:700}
.mr.ch{background:rgba(243,194,79,.1)}
.mr.ch .nm,.mr.ch .pt{color:var(--gold)}
.mu.bye{opacity:.55}
.cons{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.cons>div{flex:1 1 220px;max-width:320px}

/* ---------- record book ---------- */
.rec{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.rec .lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.rec .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin-top:8px}
.rec .big.gold{color:var(--gold)}
.rec .big.bad{color:var(--shame)}
.rec .ctx{font-size:12.5px;margin-top:5px;font-weight:600}
.rec .ctx span{color:var(--muted);font-weight:500}
.rec ol{margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);list-style:none;counter-reset:r 1}
.rec li{counter-increment:r;display:flex;gap:8px;font-size:12px;color:var(--muted);padding:2px 0}
.rec li::before{content:counter(r);color:var(--dim);width:12px;font-weight:700}
.rec li b{color:var(--text);font-weight:600;margin-left:auto}

/* ---------- versus ---------- */
.vs-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vs-pick .x{font-family:var(--display);font-weight:800;font-size:22px;color:var(--dim)}
.vs-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:22px 16px}
.vs-side{text-align:center}
.vs-side .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.vs-side .w{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;margin-top:6px}
.vs-side .s{font-size:12px;color:var(--muted);margin-top:4px}
.vs-mid{text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--dim)}
.matrix td,.matrix th{padding:6px 4px;text-align:center;font-size:11.5px}
.matrix th.rowh{text-align:left;padding-left:12px}
.matrix td.cell{min-width:44px;border-left:1px solid var(--line);font-weight:700}

/* ---------- shame ---------- */
.shame-hero{border-radius:10px;border:1px solid rgba(255,92,122,.35);background:linear-gradient(115deg,#2a1020 0%,#161226 60%,#0f1424 100%);padding:24px 26px;margin-bottom:22px}
.shame-hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--shame);text-transform:uppercase}
.shame-hero h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,60px);line-height:.95;margin:8px 0 8px;text-transform:uppercase}
.shame-hero p{margin:0;color:var(--silver);max-width:62ch}
.inductee{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.inductee .media{background:#000;display:flex;align-items:center;justify-content:center;min-height:240px}
.inductee video,.inductee img{width:100%;height:100%;max-height:460px;object-fit:cover;display:block}
.inductee .info{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.inductee .yr{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--shame);text-transform:uppercase}
.inductee .nm{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;text-transform:uppercase}
.inductee .team{font-size:13px;color:var(--muted)}
.inductee .desc{color:var(--silver);max-width:56ch;margin:0}
.inductee .stats{display:flex;gap:22px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.inductee .stats div b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.inductee .stats div span{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* ---------- mobile ---------- */
@media (max-width:980px){
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .champline{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--side);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .topbar .wm{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
  .menu-btn{background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer}
  .main{padding:18px 16px 50px}
  .reigning{display:none}
  .g2{grid-template-columns:1fr}
  .inductee{grid-template-columns:1fr}
}
@media (max-width:520px){
  .g4,.g5{grid-template-columns:1fr}
  .champline{grid-template-columns:1fr}
  .vs-side .w{font-size:42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="wordmark">K-Drama<br>Football<small>League History · Est. 2021</small></div>
    <div class="mgr-pill"><div class="av" style="background:var(--gold)">KD</div><div><b>K-Drama Football</b><span>12 teams · Yahoo H2H · PPR</span></div></div>
    <nav class="nav">
      <div class="nav-group"><div class="nav-label">League</div>
        <a href="#home" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>League Home</a>
        <a href="#history" data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</a>
        <a href="#seasons" data-v="seasons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Season Archive</a>
        <a href="#versus" data-v="versus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l6 7-6 7M19 5l-6 7 6 7"/></svg>Versus</a>
      </div>
      <div class="nav-group"><div class="nav-label">Trophy Room</div>
        <a href="#records" data-v="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 8h8M8 12h6"/></svg>Record Book</a>
        <a href="#shame" data-v="shame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-4 2-5 0 2 1 3 2 3 0-3 0-5 2-8z"/></svg>Hall of Shame</a>
      </div>
    </nav>
    <div class="side-foot">Data pulled from Yahoo Fantasy, 2021–2025. Updated <span id="updated"></span>.</div>
  </aside>

  <div class="main-wrap">
    <div class="topbar"><span class="wm">K-Drama Football</span><button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Menu</button></div>
    <main class="main">
      <header class="pagehead">
        <div class="ph-left">
          <div class="logo">KD</div>
          <div><div class="ph-title" id="phTitle">League Home</div><div class="ph-sub" id="phSub"></div></div>
        </div>
        <div class="reigning" id="reigning"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

function liveTable(){

let histTab='standings';
V.history = () => {
  const tabs=[['standings','All-Time Standings'],['playoffs','Playoff Standings'],['champs','Season Champions']];
  let body='';
  if(histTab==='standings'){
    const cols=[['m','Manager','str'],['yrs','Seasons'],['w','Record'],['pct','Win %'],['apw','All-Play'],['appct','AP Win %'],['pf','Points For'],['ppg','PPG'],['po','Playoffs'],['elo','League Rating'],['t1','Trophies']];
    const rows=[...AT].sort((a,b)=>{const k=sortAT.k;let x=a[k],z=b[k];if(k==='m'){x=nm(a.m);z=nm(b.m);return x.localeCompare(z)*sortAT.d}if(k==='yrs'){x=a.yrs.length;z=b.yrs.length}if(k==='t1'){x=a.t1*100+a.t2*10+a.t3;z=b.t1*100+b.t2*10+b.t3}return (x-z)*sortAT.d||b.elo-a.elo});
    body=`<div class="card"><div class="card-h"><div><h2>All-Time Standings</h2><p>Every manager's regular-season record, ${YEARS[0]}–${YEARS.at(-1)}. Click a column to sort.</p></div></div>
    <div class="scroll"><table id="atTable"><thead><tr>${cols.map(([k,l])=>`<th class="sortable ${sortAT.k===k?'sorted':''} ${['m','t1'].includes(k)?'':'r'}" data-k="${k}">${l}${sortAT.k===k?(sortAT.d<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(o=>`<tr class="${o.m===ME?'me':''}"><td>${whoCell(o.m)}</td><td class="r">${span(o.yrs)} <span class="dim">(${o.yrs.length})</span></td><td class="r">${o.w}-${o.l}${o.t?'-'+o.t:''}</td><td class="r">${pct(o.pct)}</td><td class="r">${o.apw}-${o.apl}${o.apt?'-'+o.apt:''}</td><td class="r">${pct(o.appct)}</td><td class="r">${o.pf.toFixed(1)}</td><td class="r">${o.ppg.toFixed(1)}</td><td class="r">${o.po}</td><td class="r"><b>${Math.round(o.elo)}</b></td><td>${trophies(o)}</td></tr>`).join('')}
    </tbody></table></div><div class="note">League Rating is an Elo score (start 1500) run over every Yahoo game from 2021–2025, playoffs included. Trophies: gold = champion, silver = runner-up, bronze = third.</div></div>`;
  } else if(histTab==='playoffs'){
    const rows=AT.filter(o=>o.po).sort((a,b)=>b.t1-a.t1||b.finals-a.finals||b.pw-a.pw||b.po-a.po);
    body=`<div class="card"><div class="card-h"><div><h2>Playoff Standings</h2><p>Championship-bracket games only. Byes don't count as wins.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Manager</th><th class="r">Appearances</th><th class="r">Playoff W-L</th><th class="r">Win %</th><th class="r">Finals</th><th class="r">Titles</th><th>Seasons in bracket</th></tr></thead><tbody>
    ${rows.map(o=>`<tr class="${o.m===ME?'me':''}"><td>${whoCell(o.m)}</td><td class="r">${o.po} <span class="dim">of ${o.yrs.length}</span></td><td class="r">${o.pw}-${o.pl}</td><td class="r">${pct(o.ppct)}</td><td class="r">${o.finals}</td><td class="r">${o.t1?`<b style="color:var(--gold)">${o.t1}</b>`:'0'}</td><td class="mut">${YEARS.filter(y=>DATA.seasons[y].seeds.includes(o.m)).map(y=>`${y} (${DATA.seasons[y].seeds.indexOf(o.m)+1})`).join(', ')}</td></tr>`).join('')}
    </tbody></table></div><div class="note">Number in parentheses is the playoff seed. ${AT.length-rows.length} managers have never made the bracket.</div></div>`;
  } else {
    body=`<div class="card"><div class="card-h"><div><h2>Season-by-Season</h2><p>Champions and leaders for every season.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Season</th><th>Champion</th><th>2nd</th><th>3rd</th><th>Best Record</th><th>Points Champ</th><th>All-Play Champ</th><th>Last Place</th></tr></thead><tbody>
    ${[...YEARS].reverse().map(y=>{const c=finisher(y,1);return `<tr><td><b>${y}</b><span class="tn mut" style="display:block;font-size:11px">${esc(DATA.league[y])}</span></td><td>${whoCell(c,teamOf(y,c))}</td><td>${esc(lbl(y,finisher(y,2)))}</td><td>${esc(lbl(y,finisher(y,3)))}</td><td>${esc(lbl(y,regChamp(y)))} <span class="dim">${(r=>`${r.w}-${r.l}`)(ST[y][regChamp(y)])}</span></td><td>${esc(lbl(y,ptsChamp(y)))} <span class="dim">${ST[y][ptsChamp(y)].pf.toFixed(1)}</span></td><td>${esc(lbl(y,apChamp(y)))} <span class="dim">${pct(ST[y][apChamp(y)].appct)}</span></td><td><span style="color:var(--shame)">${esc(lbl(y,finisher(y,12)))}</span></td></tr>`}).join('')}
    </tbody></table></div><div class="note">Placements are Yahoo's final ranks after the playoffs and consolation games. Best record and points are regular season only.</div></div>`;
  }
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${histTab===k?'on':''}" data-ht="${k}">${l}</button>`).join('')}</div>${body}`;
};

let seasonSel=null;
V.seasons = () => {

  if(!seasonSel) seasonSel=YEARS.at(-1);
  const y=seasonSel, pills=`<div class="tabs">${all.map(yy=>`<button class="tab ${yy===y?'on':''}" data-sy="${yy}">${yy}${yy===LIVE?' · Live':''}</button>`).join('')}</div>`;
  if(y===LIVE) return pills+liveTable()+weekLog(y);
  const s=DATA.seasons[y], champ=finisher(y,1);
  const mr=(t,win,champRow)=>`<div class="mr ${win?'w':''} ${champRow?'ch':''}"><span class="sd">${t[0]}</span><span class="nm">${hid(t[1])?esc(teamOf(y,t[1])):`${esc(nm(t[1]))}<small>${esc(teamOf(y,t[1]))}</small>`}</span>${t[2]!=null?`<span class="pt">${f2(t[2])}</span>`:'<span class="pt dim">BYE</span>'}</div>`;
  const mu=(m,final)=>m.bye?`<div class="mu bye">${mr(m.a,false)}</div>`:`<div class="mu ${final?'final':''}">${mr(m.a,m.a[2]>m.b[2],final&&m.a[2]>m.b[2])}${mr(m.b,m.b[2]>m.a[2],final&&m.b[2]>m.a[2])}</div>`;
  const bracket=`<div class="card"><div class="card-h"><div><h2>Playoff Bracket</h2><p>${s.seeds.length} teams · Weeks ${s.rounds[0].week}–${s.rounds.at(-1).week}</p></div></div><div class="card-b scroll">
    <div class="bracket">${s.rounds.map(r=>`<div class="round"><h4>${r.label}<span>Wk ${r.week}</span></h4><div class="stack">${r.m.map(m=>mu(m,r.label==='Final')).join('')}</div></div>`).join('')}</div>
    <div class="cons">${s.cons.map(c=>`<div><div class="round"><h4 style="color:var(--muted)">${c.label}<span>Wk ${c.week}</span></h4></div>${mu(c,false)}</div>`).join('')}</div></div></div>`;
  const rows=s.standings.map(r=>({...r,...ST[y][r.m]})).sort((a,b)=>a.rank-b.rank);
  const seedOf=m=>{const i=s.seeds.indexOf(m);return i<0?'':i+1};
  const table=`<div class="card"><div class="card-h"><div><h2>Final Standings</h2><p>Final rank after playoffs. Records, points and all-play are regular season.</p></div></div>
    <div class="scroll"><table><thead><tr><th>Rank</th><th>Manager</th><th class="r">Seed</th><th class="r">W-L-T</th><th class="r">PF</th><th class="r">PA</th><th class="r">All-Play</th><th class="r">High</th><th class="r">Low</th><th class="r">Moves</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="${r.m===ME?'me':''}"><td>${r.rank===1?`<span class="tro">${TROPHY('var(--gold)')}</span>`:r.rank===2?`<span class="tro">${MEDAL('var(--silver)')}</span>`:r.rank===3?`<span class="tro">${MEDAL('var(--bronze)')}</span>`:r.rank===12?'<span class="chip shame">12</span>':`<span class="mut">${r.rank}</span>`}</td><td>${whoCell(r.m,r.team)}</td><td class="r mut">${seedOf(r.m)}</td><td class="r">${r.record}</td><td class="r">${f2(r.pf)}</td><td class="r mut">${f2(r.pa)}</td><td class="r">${r.apw}-${r.apl}${r.apt?'-'+r.apt:''}</td><td class="r">${f2(r.hi)}</td><td class="r mut">${f2(r.lo)}</td><td class="r mut">${r.moves}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  const tiles=seasonRecords(y);
  return pills+`<section class="hero" style="padding:20px 22px"><div class="eyebrow">${y} champion · ${esc(DATA.league[y])}</div><h1 style="font-size:clamp(32px,5vw,48px)">${esc(teamOf(y,champ))}</h1><div class="by"><b>${hid(champ)?'Former member':esc(nm(champ))}</b></div><p style="color:var(--silver);max-width:70ch;margin:12px 0 0;position:relative;z-index:1">${s.subplot}</p></section>
  ${bracket}<div class="grid g4" style="margin-bottom:22px">${tiles}</div>${table}${weekLog(y)}`;
};

function seasonRecords(y){
  const gs=G[y], sc=[]; gs.forEach(g=>{sc.push({m:g[1],s:g[2],w:g[0],o:g[3],os:g[4]},{m:g[3],s:g[4],w:g[0],o:g[1],os:g[2]})});
  const hi=[...sc].sort((a,b)=>b.s-a.s)[0], lo=[...sc].sort((a,b)=>a.s-b.s)[0];
  const blow=[...gs].sort((a,b)=>Math.abs(b[2]-b[4])-Math.abs(a[2]-a[4]))[0];
  const close=[...gs].sort((a,b)=>Math.abs(a[2]-a[4])-Math.abs(b[2]-b[4]))[0];
  const W=g=>g[2]>g[4]?[g[1],g[3]]:[g[3],g[1]];
  const t=(l,v,c,tone)=>`<div class="rec"><div class="lbl">${l}</div><div class="big ${tone||''}">${v}</div><div class="ctx">${c}</div></div>`;
  return t('High score',f2(hi.s),`${esc(lbl(y,hi.m))} <span>· Wk ${hi.w}</span>`,'gold')+t('Low score',f2(lo.s),`${esc(lbl(y,lo.m))} <span>· Wk ${lo.w}</span>`,'bad')+
    t('Biggest blowout','+'+f2(Math.abs(blow[2]-blow[4])),`${esc(lbl(y,W(blow)[0]))} <span>over ${esc(lbl(y,W(blow)[1]))} · Wk ${blow[0]}</span>`)+
    t('Closest game',f2(Math.abs(close[2]-close[4])),`${esc(lbl(y,W(close)[0]))} <span>over ${esc(lbl(y,W(close)[1]))} · Wk ${close[0]}</span>`);
}

function weekLog(y){
  const weeks=[...new Set(G[y].map(g=>g[0]))].sort((a,b)=>b-a);
  return `<div class="card"><div class="card-h"><div><h2>Weekly Results</h2><p>Every matchup, newest first. Playoff weeks include consolation games.</p></div></div><div class="card-b grid g3">
  ${weeks.map(w=>`<div><div class="round"><h4>Week ${w}${w>REG[y]?'<span>Playoffs</span>':''}</h4></div><div class="mu">${G[y].filter(g=>g[0]===w).map(g=>{const aw=g[2]>g[4];return `<div class="mr ${aw?'w':''}"><span class="nm">${esc(lbl(y,g[1]))}</span><span class="pt">${f2(g[2])}</span><span class="dim" style="font-size:11px">vs</span><span class="pt" style="${!aw?'color:var(--text)':''}">${f2(g[4])}</span><span class="nm" style="text-align:right;${!aw?'color:var(--text);font-weight:700':''}">${esc(lbl(y,g[3]))}</span></div>`}).join('')}</div></div>`).join('')}
  </div></div>`;
}

V.records = () => {
  const sc=[],gl=[];
  Object.keys(G).forEach(y=>G[y].forEach(g=>{const po=g[0]>REG[y];gl.push({y,w:g[0],a:g[1],sa:g[2],b:g[3],sb:g[4],po});sc.push({y,w:g[0],m:g[1],s:g[2],o:g[3],os:g[4],po},{y,w:g[0],m:g[3],s:g[4],o:g[1],os:g[2],po})}));
  const glv=gl.filter(g=>!hid(g.a)&&!hid(g.b)), scv=sc.filter(x=>!hid(x.m)&&!hid(x.o));
  const wn=g=>g.sa>g.sb?[g.a,g.b]:[g.b,g.a];
  const card=(label,list,val,ctx,tone)=>`<div class="rec"><div class="lbl">${label}</div><div class="big ${tone||''}">${val(list[0])}</div><div class="ctx">${ctx(list[0])}</div><ol>${list.slice(1,5).map(x=>`<li>${ctx(x).replace(/<\/?span>/g,'')}<b>${val(x)}</b></li>`).join('')}</ol></div>`;
  const W=(x)=>`${esc(nm(x.m))} <span>· ${x.y} Wk ${x.w}${x.po?' (playoffs)':''}</span>`;
  const top = (arr,fn)=>[...arr].sort(fn).slice(0,5);
  // season-level
  const seas=[]; YEARS.concat(LIVE?[]:[]).forEach(y=>Object.values(ST[y]).forEach(r=>{if(!hid(r.m))seas.push({...r,y})}));
  const streaks=[]; YEARS.forEach(y=>Object.values(ST[y]).filter(r=>!hid(r.m)).forEach(r=>{let best={W:0,L:0},cur=null,n=0;r.seq.forEach(s=>{if(s===cur)n++;else{cur=s;n=1}if(s!=='T')best[s]=Math.max(best[s],n)});streaks.push({m:r.m,y,W:best.W,L:best.L})}));
  const S=x=>`${esc(nm(x.m))} <span>· ${x.y}</span>`;
  return `
  <div class="card" style="background:transparent;border:0;margin-bottom:10px"><div class="card-h" style="padding:0 0 12px"><div><h2>Single Game</h2><p>Every Yahoo game since 2021, playoffs and consolation games included. Games against former members aren't counted.</p></div></div></div>
  <div class="grid g4" style="margin-bottom:26px">
    ${card('Most points, one week',top(scv,(a,b)=>b.s-a.s),x=>f2(x.s),W,'gold')}
    ${card('Fewest points, one week',top(scv,(a,b)=>a.s-b.s),x=>f2(x.s),W,'bad')}
    ${card('Biggest blowout',top(glv,(a,b)=>Math.abs(b.sa-b.sb)-Math.abs(a.sa-a.sb)),x=>'+'+f2(Math.abs(x.sa-x.sb)),x=>`${esc(nm(wn(x)[0]))} <span>over ${esc(lbl(x.y,wn(x)[1]))} · ${x.y} Wk ${x.w}</span>`)}
    ${card('Closest game',top(glv.filter(g=>g.sa!==g.sb),(a,b)=>Math.abs(a.sa-a.sb)-Math.abs(b.sa-b.sb)),x=>f2(Math.abs(x.sa-x.sb)),x=>`${esc(nm(wn(x)[0]))} <span>over ${esc(lbl(x.y,wn(x)[1]))} · ${x.y} Wk ${x.w}</span>`)}
    ${card('Most points in a loss',top(scv.filter(x=>x.s<x.os),(a,b)=>b.s-a.s),x=>f2(x.s),x=>`${esc(nm(x.m))} <span>lost to ${esc(lbl(x.y,x.o))} · ${x.y} Wk ${x.w}</span>`)}
    ${card('Fewest points in a win',top(scv.filter(x=>x.s>x.os),(a,b)=>a.s-b.s),x=>f2(x.s),x=>`${esc(nm(x.m))} <span>beat ${esc(lbl(x.y,x.o))} · ${x.y} Wk ${x.w}</span>`)}
    ${card('Highest combined score',top(glv,(a,b)=>(b.sa+b.sb)-(a.sa+a.sb)),x=>f2(x.sa+x.sb),x=>`${esc(nm(x.a))} v ${esc(nm(x.b))} <span>· ${x.y} Wk ${x.w}</span>`)}
    ${card('Lowest combined score',top(glv,(a,b)=>(a.sa+a.sb)-(b.sa+b.sb)),x=>f2(x.sa+x.sb),x=>`${esc(nm(x.a))} v ${esc(nm(x.b))} <span>· ${x.y} Wk ${x.w}</span>`,'bad')}
  </div>
  <div class="card" style="background:transparent;border:0;margin-bottom:10px"><div class="card-h" style="padding:0 0 12px"><div><h2>Single Season</h2><p>Regular season only, completed seasons. Seasons ran 13 games through 2023 and 14 since, so points are compared per game.</p></div></div></div>
  <div class="grid g4" style="margin-bottom:22px">
    ${card('Best points per game',top(seas,(a,b)=>b.ppg-a.ppg),x=>x.ppg.toFixed(1),S,'gold')}
    ${card('Worst points per game',top(seas,(a,b)=>a.ppg-b.ppg),x=>x.ppg.toFixed(1),S,'bad')}
    ${card('Best record',top(seas,(a,b)=>b.pct-a.pct||b.pf-a.pf),x=>`${x.w}-${x.l}`,S,'gold')}
    ${card('Worst record',top(seas,(a,b)=>a.pct-b.pct||a.pf-b.pf),x=>`${x.w}-${x.l}`,S,'bad')}
    ${card('Best all-play',top(seas,(a,b)=>b.appct-a.appct),x=>pct(x.appct),S)}
    ${card('Unluckiest (most PF, losing record)',top(seas.filter(x=>x.pct<.5),(a,b)=>b.ppg-a.ppg),x=>x.ppg.toFixed(1),x=>`${S(x)} <span>· ${x.w}-${x.l}</span>`)}
    ${card('Longest win streak',top(streaks,(a,b)=>b.W-a.W),x=>'W'+x.W,S,'gold')}
    ${card('Longest losing streak',top(streaks,(a,b)=>b.L-a.L),x=>'L'+x.L,S,'bad')}
  </div>`;
};

let vsA='solo', vsB='jason';
V.versus = () => {
  const mgrs=[...AT].sort((a,b)=>nm(a.m).localeCompare(nm(b.m))).map(o=>o.m);
  if(LIVE) Object.keys(ST[LIVE]).forEach(m=>{if(!mgrs.includes(m))mgrs.push(m)});
  const all=[]; Object.keys(G).forEach(y=>G[y].forEach(g=>all.push({y,w:g[0],a:g[1],sa:g[2],b:g[3],sb:g[4],po:g[0]>REG[y]})));
  const h2h=(x,z)=>all.filter(g=>(g.a===x&&g.b===z)||(g.a===z&&g.b===x)).map(g=>g.a===x?{...g}:{...g,a:g.b,b:g.a,sa:g.sb,sb:g.sa});
  const gs=h2h(vsA,vsB), aw=gs.filter(g=>g.sa>g.sb).length, bw=gs.filter(g=>g.sb>g.sa).length;
  const ap=gs.length?gs.reduce((n,g)=>n+g.sa,0)/gs.length:0, bp=gs.length?gs.reduce((n,g)=>n+g.sb,0)/gs.length:0;
  const opt=sel=>mgrs.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${esc(nm(m))}</option>`).join('');
  const core=AT.filter(o=>o.yrs.length>=3).sort((a,b)=>b.elo-a.elo).map(o=>o.m);
  const cell=(x,z)=>{if(x===z)return `<td class="cell" style="background:var(--panel2)"></td>`;const g=h2h(x,z);if(!g.length)return `<td class="cell dim">–</td>`;const w=g.filter(q=>q.sa>q.sb).length,l=g.length-w,p=w/g.length;const bg=p>.5?`rgba(57,201,138,${.12+(p-.5)*.9})`:p<.5?`rgba(255,107,107,${.12+(.5-p)*.9})`:'transparent';return `<td class="cell" style="background:${bg}" title="${esc(nm(x))} vs ${esc(nm(z))}: ${w}-${l}">${w}-${l}</td>`};
  return `<div class="card"><div class="card-h"><div><h2>Head to Head</h2><p>Every meeting since 2021, playoffs included.</p></div>
    <div class="vs-pick"><select id="vsA" aria-label="First manager">${opt(vsA)}</select><span class="x">VS</span><select id="vsB" aria-label="Second manager">${opt(vsB)}</select></div></div>
    <div class="vs-score"><div class="vs-side">${av(vsA)}<div class="n" style="margin-top:8px">${esc(nm(vsA))}</div><div class="w" style="color:${aw>bw?'var(--good)':aw<bw?'var(--muted)':'var(--text)'}">${aw}</div><div class="s">${ap.toFixed(1)} avg</div></div>
    <div class="vs-mid">${gs.length} GAME${gs.length===1?'':'S'}</div>
    <div class="vs-side">${av(vsB)}<div class="n" style="margin-top:8px">${esc(nm(vsB))}</div><div class="w" style="color:${bw>aw?'var(--good)':bw<aw?'var(--muted)':'var(--text)'}">${bw}</div><div class="s">${bp.toFixed(1)} avg</div></div></div>
    ${gs.length?`<div class="scroll"><table><thead><tr><th>Season</th><th>Week</th><th>${esc(nm(vsA))}</th><th class="r">Score</th><th class="r">Score</th><th>${esc(nm(vsB))}</th><th class="r">Margin</th></tr></thead><tbody>
    ${gs.sort((a,b)=>b.y-a.y||b.w-a.w).map(g=>`<tr><td>${g.y}</td><td>${g.w}${g.po?' <span class="chip">Playoffs</span>':''}</td><td class="mut">${esc(teamOf(g.y,g.a))}</td><td class="r ${g.sa>g.sb?'pos':''}"><b>${f2(g.sa)}</b></td><td class="r ${g.sb>g.sa?'pos':''}"><b>${f2(g.sb)}</b></td><td class="mut">${esc(teamOf(g.y,g.b))}</td><td class="r">${(g.sa-g.sb>0?'+':'')+f2(g.sa-g.sb)}</td></tr>`).join('')}
    </tbody></table></div>`:`<div class="note">These two have never played each other.</div>`}
  </div>
  <div class="card"><div class="card-h"><div><h2>Rivalry Grid</h2><p>Row manager's record against the column manager. Managers with 3+ seasons, sorted by League Rating.</p></div></div>
  <div class="scroll"><table class="matrix"><thead><tr><th class="rowh"></th>${core.map(m=>`<th title="${esc(nm(m))}">${initials(m)}</th>`).join('')}</tr></thead><tbody>
  ${core.map(x=>`<tr><th class="rowh">${esc(nm(x))}</th>${core.map(z=>cell(x,z)).join('')}</tr>`).join('')}</tbody></table></div></div>`;
};

V.shame = () => {
  const ind=SHAME.map(s=>{const r=DATA.seasons[s.season].standings.find(r=>r.m===s.m),t=ST[s.season][s.m];
    const media=s.media.endsWith('.mp4')?`<video controls playsinline preload="metadata"><source src="${s.media}" type="video/mp4"></video>`:`<img src="${s.media}" alt="${esc(nm(s.m))}'s ${s.season} punishment" loading="lazy">`;
    return `<article class="inductee"><div class="media">${media}</div><div class="info"><div class="yr">${s.season} season · finished ${ord(r.rank)} of 12</div><div class="nm">${esc(nm(s.m))}</div><div class="team">${esc(teamOf(s.season,s.m))} · ${r.record} · ${f2(r.pf)} PF</div><p class="desc">${esc(s.desc)}</p>
    <div class="stats"><div><b>${t.apw}-${t.apl}</b><span>All-play</span></div><div><b>${f2(t.lo)}</b><span>Worst week</span></div><div><b>${t.seq.reduce((b,s,i,a)=>{let n=0;for(let j=i;j<a.length&&a[j]==='L';j++)n++;return Math.max(b,n)},0)}</b><span>Longest skid</span></div></div></div></article>`}).join('');
  const inducted=new Set(SHAME.map(s=>s.season));
  const pre=YEARS.filter(y=>!inducted.has(y)).map(y=>{const m=finisher(y,12),r=DATA.seasons[y].standings.find(r=>r.rank===12);return `<tr><td><b>${y}</b></td><td>${whoCell(m,teamOf(y,m))}</td><td class="r">${r.record}</td><td class="r">${f2(r.pf)}</td><td class="mut">Before the punishment era</td></tr>`}).join('');
  let hot='';
  if(LIVE){const t=Object.values(ST[LIVE]).sort((a,b)=>a.pct-b.pct||a.pf-b.pf).slice(0,3);hot=`<div class="card"><div class="card-h"><div><h2>On the Hot Seat · ${LIVE}</h2><p>The bottom three right now. One of them is getting the next video.</p></div><span class="chip shame">Live</span></div><div class="scroll"><table><tbody>${t.map((r,i)=>`<tr class="${r.m===ME?'me':''}"><td class="mut">${12-i}</td><td>${whoCell(r.m,teamOf(LIVE,r.m))}</td><td class="r">${r.w}-${r.l}</td><td class="r">${f2(r.pf)} PF</td></tr>`).join('')}</tbody></table></div></div>`}
  const counts={};YEARS.forEach(y=>{const m=finisher(y,12);counts[m]=(counts[m]||0)+1});
  const repeat=Object.entries(counts).filter(([m,c])=>c>1).map(([m,c])=>`${nm(m)} (${c}x)`).join(', ');
  return `<section class="shame-hero"><div class="eyebrow">Last place doesn't walk away free</div><h1>Hall of Shame</h1><p>Finish 12th and you owe the league a punishment, on camera. ${repeat?`Repeat offenders: <b>${esc(repeat)}</b>.`:''}</p></section>
  ${ind}
  ${hot}
  <div class="card"><div class="card-h"><div><h2>Before the Tradition</h2><p>Last-place finishers from the seasons before punishments started.</p></div></div><div class="scroll"><table><thead><tr><th>Season</th><th>Manager</th><th class="r">Record</th><th class="r">PF</th><th></th></tr></thead><tbody>${pre}</tbody></table></div></div>`;
};

/* ---------- router ---------- */
const TITLES={home:['League Home','Overview'],history:['League History','All-time standings, playoffs and champions'],seasons:['Season Archive','Brackets, standings and every weekly result'],versus:['Versus','Head-to-head records'],records:['Record Book','All-time league records'],shame:['Hall of Shame','The punishment archive']};
function render(){
  let v=(location.hash||'#home').slice(1); if(!V[v]) v='home';
  document.getElementById('view').innerHTML=V[v]();
  document.getElementById('phTitle').textContent=TITLES[v][0];
  document.getElementById('phSub').textContent=`K-Drama Football · ${YEARS.length} seasons complete · ${TITLES[v][1]}`;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  document.getElementById('app').classList.remove('open');
  bind();
}
function bind(){
  document.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{histTab=b.dataset.ht;render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{histTab=b.dataset.tab});
  document.querySelectorAll('[data-sy]').forEach(b=>b.onclick=()=>{seasonSel=b.dataset.sy;render()});
  document.querySelectorAll('#atTable th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortAT=sortAT.k===k?{k,d:-sortAT.d}:{k,d:k==='m'?1:-1};render()});
  const a=document.getElementById('vsA'),b=document.getElementById('vsB');
  if(a){a.onchange=()=>{vsA=a.value;render()};b.onchange=()=>{vsB=b.value;render()}}
}
function reigning(){
  const y=YEARS.at(-1);
  document.getElementById('reigning').innerHTML=`<div><div style="display:flex;gap:16px">${[1,2,3].map(r=>`<span class="rc"><span class="tro">${r===1?TROPHY('var(--gold)'):MEDAL(r===2?'var(--silver)':'var(--bronze)')}</span><span style="${r===1?'color:var(--gold)':''}">${esc(nm(finisher(y,r)))}</span></span>`).join('')}</div><div class="cap">REIGNING CHAMPIONS · ${y}</div></div>`;
}
document.getElementById('menuBtn').onclick=()=>{const app=document.getElementById('app');app.classList.toggle('open');document.getElementById('menuBtn').setAttribute('aria-expanded',app.classList.contains('open'))};
document.getElementById('side').addEventListener('click',e=>{if(e.target.closest('a'))document.getElementById('app').classList.remove('open')});
document.getElementById('updated').textContent=UPDATED;
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
reigning(); render();
</script>
</body>
